name: Debug Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: gradle

      - name: Grant execution permission to Gradle Wrapper
        run: chmod +x gradlew

      # Tests and lint run before the APK is built: a change that breaks either must not produce a
      # green build artifact. 46 tests now exist locally (38 from the 2.0.3 audit round plus 8 new
      # ones for the backup archive format and the 1.x -> 2.0 body rewrite); none of them ran in CI
      # before this gate existed.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Build Debug App
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WriteOn-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
