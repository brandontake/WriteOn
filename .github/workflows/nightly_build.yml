name: Nightly Build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: gradle

      - name: Grant execution permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      # A nightly is a debug build, so it needs no signing secrets. The previous workflow decoded
      # the release keystore and handed it to a third-party action pinned to `@main`, which put the
      # upload key in reach of whatever that branch contained that day.
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WriteOn-nightly.apk

      - name: Upload the APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WriteOn-Nightly
          path: WriteOn-nightly.apk

      - name: Update nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view Nightly >/dev/null 2>&1 || \
            gh release create Nightly --title "Nightly" --notes "Automated nightly build."
          gh release upload Nightly WriteOn-nightly.apk --clobber
