name: Release Build

# A release is cut from a tag, not from every push to master. The old workflow published a
# hard-coded `v1.8` on each master build, so the tag and the APK it pointed at were unrelated.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: gradle

      - name: Grant execution permission to Gradle Wrapper
        run: chmod +x gradlew

      # Release builds are gated on the same checks as the debug workflow.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "KEY_BASE64 is not configured; refusing to publish a debug-signed APK." >&2
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 --decode > writeon-upload.jks
          cat > keystore.properties <<EOF
          storeFile=writeon-upload.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Verify signature
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "${APKSIGNER}" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Checksum and rename APK
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/release/app-release.apk "WriteOn-${TAG}.apk"
          sha256sum "WriteOn-${TAG}.apk" | tee "WriteOn-${TAG}.apk.sha256"

      - name: Upload the APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WriteOn-${{ github.ref_name }}
          path: |
            WriteOn-${{ github.ref_name }}.apk
            WriteOn-${{ github.ref_name }}.apk.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" \
            "WriteOn-${TAG}.apk" \
            "WriteOn-${TAG}.apk.sha256" \
            --title "${TAG}" \
            --generate-notes
